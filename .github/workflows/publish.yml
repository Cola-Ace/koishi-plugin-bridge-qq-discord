name: Publish

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  id-token: write   # 必需：用于 OIDC 与 npm 信任发布
  contents: write   # 需要写权限以创建 release（如使用 release-action）

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'

    - name: Install Dependencies
      run: yarn

    - name: TSC
      run: yarn tsc

    - name: Build Project
      run: yarn build

    - name: Verify Version
      run: |
        PACKAGE_VERSION=$(node -p "require('./package.json').version")
        if [ "$GITHUB_REF_NAME" != "v$PACKAGE_VERSION" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match package version $PACKAGE_VERSION"
          exit 1
        fi
        echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"

    - name: Publish to npm (Trusted Publishing)
      run: |
        PACKAGE_NAME=$(node -p "require('./package.json').name")
        if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version > /dev/null 2>&1; then
          echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published"
        else
          npm publish
        fi

    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        bodyFile: "CHANGELOG.md"
        tag: v${{ env.PACKAGE_VERSION }}
        name: v${{ env.PACKAGE_VERSION }}
        allowUpdates: true
